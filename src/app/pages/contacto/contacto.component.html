<div class="contenedor-contacto">

    <div class="titulo">

        <h1>Contáctanos</h1>

        <p>
            Déjanos tus comentarios, preguntas o sugerencias.
        </p>

    </div>

    <form
        [formGroup]="formulario"
        (ngSubmit)="enviar()">

        <div class="campo">

            <label>Nombre</label>

            <input
                type="text"
                formControlName="nombre">

            <small *ngIf="formulario.get('nombre')?.invalid && formulario.get('nombre')?.touched">
                El nombre es obligatorio
            </small>

        </div>

        <div class="campo">

            <label>Correo electrónico</label>

            <input
                type="email"
                formControlName="correo">

            <small *ngIf="formulario.get('correo')?.invalid && formulario.get('correo')?.touched">
                Ingrese un correo válido
            </small>

        </div>

        <div class="campo">

            <label>Mensaje</label>

            <textarea
                rows="5"
                formControlName="mensaje">
            </textarea>

            <small *ngIf="formulario.get('mensaje')?.invalid && formulario.get('mensaje')?.touched">
                El mensaje es obligatorio
            </small>

        </div>

        <button type="submit">
            Enviar mensaje
        </button>

    </form>

    <div
        class="confirmacion"
        *ngIf="enviado">

        ✅ Mensaje enviado correctamente

    </div>

</div>
