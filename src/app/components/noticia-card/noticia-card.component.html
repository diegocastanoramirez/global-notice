<div class="card">

    <img
        [src]="noticia.imagen"
        [alt]="noticia.titulo">

    <div class="card-body">

        <span class="categoria">
            {{ noticia.categoria }}
        </span>

        <h3>
            {{ noticia.titulo }}
        </h3>

        <p>
            {{ noticia.descripcion }}
        </p>

        <div class="acciones">

            <button
                class="btn-favorito"
                (click)="toggleFavorito()">

                {{ esFavorito ? '❤️ Guardado' : '🤍 Favorito' }}

            </button>

        <button
            class="btn-detalle"
            (click)="verDetalle()">
            
            Ver más
            
        </button>

        </div>

    </div>

</div>
